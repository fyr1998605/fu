Tracker:
  # 电控延迟 0.2 0.015
  COMMAND_TIMESPAN: 0.2
  # 重力加速度
  local_gravity_: 9.80665
  # 曝光时间 0.002
  eTime: 0.02
  # 图像传输,程序运行处理等时间
  delay_time: -0.02
  # 目标丢失判定时间
  trackTime: 0.7
  # pitch补偿 减小往下 增大往上 麦轮: -0.075 英雄: 0.12 全向: 0.0225
  pitch_compensation: -0.028
  # yaw补偿   增大往左 减小往右 麦轮: 0.010 英雄: -0.06 全向: 0
  yaw_compensation: -0.005
  # 装甲板匹配得分最大值
  score_tolerance: 1.0
  # 更新装甲板切换的角度阈值,角度制
  switch_threshold: 15
  # 自动击发时目标装甲板相对偏角最大值,角度值 
  aim_angle_tolerance: 40
  # 自动击发位姿偏差最大值,弧度制 英雄: 0.025 步兵 0.05
  aim_pose_tolerance: 0.05
  # 跟随圆心自动击发目标偏角判断
  aim_center_angle_tolerance: 1
  # 更换锁中心模式角速度阈值，弧度制
  switch_trackmode_threshold: 1.2
  # 跟随圆心转跟随装甲板的目标旋转速度最大值，弧度制
  aim_center_palstance_threshold: 6.5
  # 强制允许发射的目标旋转速度最大值，弧度制 0.8
  force_aim_palstance_threshold: 8
  # 是否跟随装甲板中心
  track_center: 1
  # 重力补偿开关
  fix_on: 1
  # 空气阻力系数 1.5
  k: 0.47
  # 弹速
  BulletVector: 23.5 # 步兵哨兵: 21 英雄: 12

