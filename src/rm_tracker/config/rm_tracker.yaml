ModelObserver:
  # 初始值,但代码中应该动态计算实际帧时间
  # 参数调整原则
  # 过程噪声调大: 滤波器更信任测量值,响应块但可能更震荡
  # 过程噪声调小：滤波器更信任预测值,相应更平滑但可能滞后
  # 观测噪声调大: 滤波器更信任预测值,对测量误差不敏感
  # 观测噪声调小: 滤波器更信任测量值,对状态变化更敏感
  # 响应迟缓增大Q减小R,过度震荡减小Q增大R
  dt: 0.025
  
  Standard:
    # 初始化半径
    init_radius: 0.2
    # 测距噪声关于角度的增益函数
    gain: 25

    # 过程噪声(表示模型的不确定性)Q
    process_noise:
      # 位移的高阶差分噪声.控制位置和速度变化的不确定性,值越大滤波器对新测量的相应越慢
      displace_high_diff: 0.15
      # 角度的高阶差分噪声.控制角度和角速度变化的不确定性
      anglar_high_diff: 16
      # 高度噪声.机器人高度变化的不确定性
      height: 0.0001
      # 旋转半径噪声.机器人旋转半径变化的不确定性
      radius: 0.0005

    # 观测噪声系数 R
    measure_noise:
      # 位置观测噪声,视觉测量位置的不确定性(和x,y有关)
      pose: 0.00164
      # 距离观测噪声,测距的不确定性(和z有关)
      distance: 0.0129
      # 角度观测网噪声,角度怎两的不确定性
      angle: 0.1

  Balance:
    # 初始半径
    init_radius: 0.2
    # 测距噪声关于角度的增益的函数
    gain: 30

    # 状态转移噪声系数
    process_noise: 
      # 更小的位移噪声,因为平衡步兵运动模型更可预测
      displace_high_diff: 0.2
      # 较大的角度噪声,因为平衡步兵旋转更频繁
      anglar_high_diff: 10
      # 更小的高度噪声,高度变化较小
      height: 0.0001
      # 更小的半径噪声,旋转半径更稳定
      radius: 0.00001

    # 观测噪声系数
    measure_noise: 
      # 更小的位置噪声,假设视觉检测更准确
      pose: 0.002
      # 更小的距离噪声,测距更准确
      distance: 0.01
      # 较大的角度噪声,因为平衡步兵角度变化大
      angle: 0.5

  Outpost:
    # 很高的增益,因为前哨战固定,距离测量噪声角度变化影响大
    # 初始半径
    init_radius: 0.256
    gain: 100

    # 状态转移噪声系数
    process_noise:
      # 极小的位移噪声,因为前哨战基本不动
      displace_high_diff: 0.01
      # 较小的角度噪声,前哨战有小幅度固定的旋转
      anglar_high_diff: 2.0
      # 极小的高度噪声,高度固定不变
      height: 0.0035
      radius: 0.0005

    # 观测噪声系数
    measure_noise:
      # 很小的位置噪声,固定目标检测准确
      pose: 0.0005
      # 中等距离噪声
      distance: 0.01
      # 较小的角度噪声,角度测量相对准确
      angle: 0.02

