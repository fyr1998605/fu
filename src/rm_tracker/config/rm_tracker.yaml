# 西工大MPC
MPC:
  debug: 0
  # 预测步长
  # step太小: 优点: 计算快,响应迅速 缺点: 目光短浅,长时优化差
  # step适中: 平衡性能与计算,需要合理调参
  # step太大: 优点: 前瞻性好,稳定   缺点: 计算量大,易发散
  step: 5

  # 过程误差权重
  # Q对预测时间段内误差的重视程度
  # Q较大 -> 非常在意角度误差,会快速调整
  # Q较小 -> 可以容忍一定的角度误差
  process_error_weight:
    Q0: 800 # ptich
    Q1: 80 # yaw
    Q2: 1     # vptich
    Q3: 1     # vyaw

  # 控制权重矩阵
  # R代表对预测时间段控制量的重视程度
  # R较大 -> MPC会尽量使用小的控制量,更平滑但响应慢
  # R较小 -> 允许使用更大的控制量,响应快但可能震荡
  process_control_weight:
    R0: 10 # pitch
    R1: 8  # yaw
  
  # 终端误差权重
  # F代表对预测时间段后的这一时刻的误差量的重视程度
  target_error_weight:
    F0: 800 # pitch
    F1: 100 # yaw
    F2: 1
    F3: 1
  # F太大
    # 行为: MPC急功近利
    # 表现: 一开始猛打方向盘,试图快速到达终端状态
    # 问题: 过程中剧烈震荡
  # F太小:
    # 行为: MPC变得目光短浅
    # 表现: 只关心眼前误差,不计划长远
    # 问题: 终端时可误差大,打不中移动目标
  # F合适:
    # 行为: MPC眼光长远
    # 表现: 平衡过程跟踪和终端精度
    # 结果: 平衡跟踪,最终准确命中

# 同济MPC
Planner:
  fire_thresh: 0.0035

