# Fu-only configuration. Do not put armor auto-aim settings in this file.

# Fu PnP calibration: adjust target width/height, camera matrix, and distortion below.
buff_target_width_mm: 300.0
buff_target_height_mm: 300.0
buff_camera_matrix: [1724.18353097744, -0.000579628569003521  , 680.697138243768, 0.0,  1726.83294106563,  504.398280989468, 0.0, 0.0, 1.0]
buff_dist_coeffs: [-0.0834722705527182, 0.496852388408421    , -0.000457625756594158  ,  0.00246230944307382, -0.0130632578222697]

# ============================================================
#  时间补偿: 总提前量 = 子弹飞行时间 + 视觉链路延迟 + 电控延时
# ============================================================
# 预测相位是在「图像曝光时刻」测到的, 弹丸却要等到这几段延时走完才飞出去:
#
#   t_impact = t_exposure + 视觉链路延迟 + 电控延时 + 子弹飞行时间
#
# 少补一段, 打点就滞后一个**常值角度**(60°/s 转速下, 少补 20ms = 滞后 1.2°,
# 而且不随距离变化, 标定时表现为"永远慢半拍")。补多了则整体超前。
# 飞行时间由弹道解算自动算(弹速取自电控上报的 BulletVec), 下面两项是人工标定。
#
# 【现场标定方法】
# ① 把 buff_vision_delay_auto 打开, 跑一局看日志里的
#    `[BUFF_DELAY] 视觉链路 实测=xx ms` —— 这就是你相机的真实链路耗时。
# ② 把它填进 buff_vision_delay_seconds, 再把 auto 关掉(固定值更稳, 不受
#    偶尔的推理卡顿影响)。
# ③ 电控延时找电控问: /auto_angle 下发到云台真正转到指令角/弹丸出膛要多久。
#    问不到就按"串口周期 + 云台阶跃响应"估, 50Hz 串口 + 快云台约 30~50ms。
#
# 标定后的验证: 打靶时若打点系统性滞后 → 调大; 系统性超前 → 调小。
# 注意只改这两项, 不要再去动弹道部分。

buff_vision_delay_seconds: 0.10
  # [视觉] 固定视觉链路延迟(秒): 曝光 → 相机传输 → ROS 队列 → YOLO推理 → PnP → 下发
  # 典型值: 全局快门 + OpenVINO CPU 推理, 30~80ms。默认 0.10 = 老代码里
  # delta_t_compensation(0.15) 拆出来的视觉那一半, 保持原先的打点手感。
buff_ec_delay_seconds: 0.05
  # [电控] 固定电控延时(秒): 下发 → 串口 → 电控解算 → 云台到位/发弹
  # 默认 0.05, 与上面相加正好等于老代码硬编码的 0.15。调这个之前先问电控。
buff_vision_delay_auto: false
  # [开关] true = 用图像时间戳实测视觉链路延迟(EMA平滑)代替上面的固定值。
  # 好处是自动跟上相机/推理的负载变化; 代价是偶发卡顿会短暂影响提前量。
  # 回放 bag 或相机时钟与主机不同源时, 实测值会超出合理区间, 自动回落到
  # 固定值并打 WARN, 不会把提前量带飞。标定完建议关掉。

# ============================================================
#        能量机关 世界坐标系 EKF (扩展卡尔曼滤波) 完整参数手册
# ============================================================
# 状态向量 X = [center_x, center_y, normal_angle, omega]
#   center_x/y : 能量机关旋转中心在世界坐标系下的 2D 坐标 (米)
#   normal     : 能量机关平面的法向量角度 (弧度)
#   omega      : 绕旋转中心的角速度 (弧度/秒)
#
# 预测步骤: X_k = F * X_{k-1}
#   匀速模型: center 匀速移动, normal 不变, omega 不变
#   phase 通过 omega * dt 积分
#
# 更新步骤: 用 PnP 解算的测量值修正预测值
#   K = P * H^T * (H * P * H^T + R)^{-1}  <-- 卡尔曼增益
#   X = X + K * (z_measured - z_predicted)
# ============================================================

# -------------------- 开关 & 物理参数 --------------------
buff_world_ekf_enabled: false                  # [开关] 是否启用 EKF, false 则直接用 PnP 原始值
buff_world_ekf_control_enabled:  false         # [开关] EKF 控制输入(云台反馈)是否启用
buff_world_ekf_primary: false                   # [输出] false=旁路诊断, true=允许EKF接管主输出
buff_quaternion_is_imu_to_map: true           # [方向] 四元数旋转方向, 一般不改
buff_imu_stamp_offset_seconds: 0.0            # [同步] IMU 时间戳偏移(秒), IMU比相机快时填正值
buff_radius_mm: 650.00                        # [尺寸] 能量机关半径(mm), 中心→装甲板距离
buff_hub_normal_offset_mm: 0.0                # [尺寸] 中心hub法向偏移(mm), 一般=0

# Buff motion model selection. The shared image/Kalman path remains the
# startup and dropout fallback; big mode replaces only its phase extrapolation
# with the variable-speed predictor after warm-up.
buff_move_mode: small
# small = current constant-speed image Kalman; big = shared image path with
# variable-speed phase prediction after warm-up. Change only this value to
# switch modes at launch.
buff_target_priority: locked
buff_target_lock_timeout_seconds: 0.25
buff_big_variable_speed_enabled: true
buff_big_ransac_enabled: false
buff_big_ransac_max_iterations: 200
buff_big_ransac_threshold: 0.5
buff_big_ransac_min_omega: 1.884
buff_big_ransac_max_omega: 2.0
buff_big_ransac_min_amplitude: 0.780
buff_big_ransac_max_amplitude: 1.045
buff_big_ransac_min_inliers: 100
buff_big_ransac_fit_every_n_samples: 5
buff_big_ransac_max_abs_speed: 3.2
buff_big_ransac_max_gap_seconds: 5.0
buff_big_ransac_max_consecutive_rejections: 30

# ============================================================
#  观测噪声 R (Measurement Noise) —— "PnP 测量值有多不准?"
# ============================================================
# 物理含义: PnP 解算结果的噪声方差, 由相机标定精度、检测精度决定
#
# 调大 R → 卡尔曼增益 K 变小 → EKF "不相信"测量 → 输出平滑但滞后
# 调小 R → 卡尔曼增益 K 变大 → EKF "相信"测量   → 输出灵敏但抖动
#
# 症状诊断:
#   ✗ 输出跟不上目标旋转 → 观测噪声太大, 应减小 R
#   ✗ 输出在目标附近抖动 → 观测噪声太小, 应增大 R

buff_world_center_measurement_std_m: 0.015
  # [观测噪声-R] 中心位置测量标准差(米)
  # PnP 解算出的旋转中心的"可信度"
  # 0.01=很信PnP中心 / 0.05=不太信PnP中心
  # 推荐: 0.015 ~ 0.05

buff_world_normal_measurement_std_rad: 0.030
  # [观测噪声-R] 法向量角度测量标准差(弧度)
  # PnP 解算出的平面朝向的"可信度"
  # 推荐: 0.02 ~ 0.10

buff_world_phase_measurement_std_rad: 0.05
  # [观测噪声-R] 相位角测量标准差(弧度)  ★ 最敏感参数之一
  # PnP 解算出的当前旋转角度的"可信度"
  # 相位最难从单帧精确测量, 这个值通常设得比 center/normal 大
  # 0.05=很信PnP相位(但可能闪烁) / 0.40=更多靠角速度积分预测相位
  # 推荐: 0.05 ~ 0.40

# ============================================================
#  过程噪声 Q (Process Noise) —— "匀速运动模型有多不准?"
# ============================================================
# 物理含义: 模型预测的"不确定性" (单位时间的累积误差)
#
# 调大 Q → 卡尔曼增益 K 变大 → EKF "不相信"匀速模型 → 响应快但可能震荡
# 调小 Q → 卡尔曼增益 K 变小 → EKF "相信"匀速模型 → 平滑但跟不上机动
#
# 症状诊断:
#   ✗ 能量机关加减速时输出跟不上 → 过程噪声太小, 应增大 Q
#   ✗ 能量机关匀速时输出也抖动 → 过程噪声太大, 应减小 Q

buff_world_center_process_std_mps: 0.015
  # [过程噪声-Q] 中心位置的过程噪声谱密度开根号(米/秒)
  # 表示每秒钟中心"可能移动多少米"的不确定性
  # 能量机关中心通常固定不动 → 这个值可以很小
  # 0.005=中心基本不动 / 0.05=中心可能有明显移动
  # 推荐: 0.005 ~ 0.05

buff_world_normal_process_std_radps: 0.05
  # [过程噪声-Q] 法向量角度的过程噪声谱密度开根号(弧度/秒)
  # 表示每秒钟法向量"可能转多少弧度"的不确定性
  # 法向量通常不变 → 可以设小
  # 推荐: 0.005 ~ 0.10

buff_world_omega_process_std_radps2: 0.40
  # [过程噪声-Q] 角速度的过程噪声谱密度开根号(弧度/秒²)  ★★★ 最最重要!!!
  # 表示每秒钟角速度"可能变化多少 rad/s"的不确定性
  # 这是对跟踪效果影响最大的参数!
  # 能量机关转速不是严格恒定的 (有摩擦、风阻、控制波动)
  # 0.10=假设转速非常恒定, 平滑但跟不上转速变化
  # 0.50=允许转速快速改变, 能跟上但可能震荡
  # 推荐: 0.10 ~ 0.50
  # 大能量机关(转速变化大) → 设大些 0.3~0.5
  # 小能量机关(转速稳定)   → 设小些 0.1~0.25

# ============================================================
#  调参决策树 (按顺序来!)
# ============================================================
# ① 先确认 EKF 确实在运行:
#    看 ROS_INFO 输出 "World EKF: enabled"
#
# ② 观察图像上投影点的行为:
#    投影点滞后(跟在目标后面跑) → 检查下面③
#    投影点抖动(在目标周围跳来跳去) → 检查下面④
#    投影点完全没变化(改了参数也不变) → EKF可能没生效!
#
# ③ 投影滞后 → 减小观测噪声 或 增大过程噪声:
#    优先: 减小 buff_world_phase_measurement_std_rad (如 0.20→0.10)
#    其次: 增大 buff_world_omega_process_std_radps2 (如 0.25→0.40)
#
# ④ 投影抖动 → 增大观测噪声 或 减小过程噪声:
#    优先: 增大 buff_world_phase_measurement_std_rad (如 0.20→0.35)
#    其次: 减小 buff_world_omega_process_std_radps2 (如 0.40→0.20)
#
# ⑤ 如果怎么改都没变化 → 说明图像上画的不是 EKF 结果!
#    可能是直接画了 PnP 原始解算点, 或者 EKF 被跳过(ekf_enabled=false)
# ============================================================

# Fu coordinate conversion: camera -> IMU -> gun. Units are metres/radians.
CoordinateTransformer:
